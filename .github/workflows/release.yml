# انتشار خودکار: با هر برچسب v* (مثلاً v1.7.0) آزمون‌ها اجرا می‌شوند، بستهٔ zip ساخته
# می‌شود و یک Release گیت‌هاب با همان فایل منتشر می‌شود. بخش «به‌روزرسانی» یار همین
# Release را می‌خواند، پس کاربران چند ساعت بعد خبردار می‌شوند.
#
#   git tag v1.7.0 && git push origin v1.7.0
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # برچسب و نسخهٔ manifest باید یکی باشند؛ وگرنه افزونه نسخهٔ تازه را «تازه» نمی‌بیند
      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match manifest.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: node tools/tests/run-all.mjs

      - name: Build package
        run: python3 tools/pack.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$(mktemp)"
          # اگر CHANGELOG.md بخشی برای این نسخه دارد همان متن تغییرات می‌شود؛ وگرنه گیت‌هاب از کامیت‌ها می‌سازد
          if [ -f CHANGELOG.md ] && awk -v v="$VERSION" '$0 ~ "^## " && index($0, v) {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$NOTES_FILE" && [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" "dist/yar-$VERSION.zip" --title "یار $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" "dist/yar-$VERSION.zip" --title "یار $VERSION" --generate-notes
          fi
