<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>پیش‌نمایش یار</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../src/styles/base.css" />
    <link rel="stylesheet" href="../../src/styles/components.css" />
    <link rel="stylesheet" href="../../src/styles/layout.css" />
    <link rel="stylesheet" href="../../src/styles/widgets.css" />
    <link rel="stylesheet" href="../../src/styles/features.css" />
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="wallpaper__veil" aria-hidden="true"></div>

    <div class="page">
      <header class="rail">
        <span class="rail__brand">
          <svg class="rail__mark" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="yar-mark" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#22d3ee" />
                <stop offset="1" stop-color="#6366f1" />
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="24" height="24" rx="5.6" fill="url(#yar-mark)" />
            <circle
              cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="3.1"
              stroke-dasharray="33.5 7.3" transform="rotate(-20 12 12)"
            />
            <circle cx="16" cy="6.9" r="2.35" fill="#fff" />
          </svg>
          <span class="rail__word">یار</span>
        </span>
        <a class="rail__credit" id="rail-credit" target="_blank" rel="noopener noreferrer" hidden></a>
        <div class="rail__spacer"></div>
        <div class="rail__tools" id="rail-tools"></div>
      </header>

      <main class="stage">
        <section class="side" id="slot-side" aria-label="امروز و تقویم"></section>

        <section class="hero" id="slot-hero" aria-label="جست‌وجو و میان‌برها"></section>

        <section class="panel" id="slot-panel" aria-label="کارها، یادداشت و اخبار"></section>
      </main>

      <footer class="footer" id="slot-ticker"></footer>
    </div>

    <script src="./fixtures.js"></script>
    <script src="./chrome-mock.js"></script>
    <script type="module" src="../../src/newtab/newtab.js"></script>
  </body>
</html>
